# Sveltia CMS — the editing UI served at /admin.
# Saving a page here commits to content/*.json on GitHub, which triggers the
# Cloudflare build that regenerates the site. There is no server of our own.
backend:
  name: github
  repo: dazzlehs/ptt-website-2026
  branch: master
  # "Sign In Using Access Token" works with no extra setup - paste a GitHub
  # personal access token with repo scope. To get the nicer "Sign In with
  # GitHub" button instead, deploy a sveltia-cms-auth Worker and uncomment:
  # base_url: https://<your-auth-worker>.workers.dev

# Used by the "local backend" during development (npx @sveltia/cms-proxy-server)
local_backend: true

media_folder: assets
public_folder: assets
publish_mode: simple

